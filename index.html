// 查询逻辑
function checkScore() {
  const name = document.getElementById("nameInput").value.trim();
  const code = document.getElementById("codeInput").value.trim();
  const student = data.find(d => d.name === name && d.code === code);

  if (!student) {
    alert("查无此人，请检查姓名和验证码。");
    return;
  }

  document.getElementById("form-area").classList.add("hidden");
  document.getElementById("result-area").classList.remove("hidden");
  document.getElementById("studentName").innerText = student.name + " 的成绩";

  const tbody = document.querySelector("#scoreTable tbody");
  tbody.innerHTML = ""; // 清空表格内容

  for (const subject in student.subjects) {
    const { score, schoolRank, classRank } = student.subjects[subject];
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${subject}</td>
      <td>${score}</td>
      <td>${schoolRank}</td>
      <td>${classRank}</td>
    `;
    tbody.appendChild(tr);
  }
}

function resetForm() {
  document.getElementById("form-area").classList.remove("hidden");
  document.getElementById("result-area").classList.add("hidden");
  document.getElementById("nameInput").value = "";
  document.getElementById("codeInput").value = "";
}
</script>
